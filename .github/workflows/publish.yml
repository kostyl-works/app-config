name: Publish hosts
run-name: "hosts (${{ inputs.environment || 'auto' }}): ${{ github.event.head_commit.message || 'ручной запуск' }} (${{ github.actor }})"

# Оба окружения живут в main. Публикуем только те, чьи hosts.json изменились.
on:
  push:
    branches: [main]
    paths: [hosts.json, dev/hosts.json, rutube.json, dev/rutube.json]
  workflow_dispatch:
    inputs:
      environment:
        description: Какое окружение опубликовать
        type: choice
        required: true
        default: dev
        options: [dev, prod]
      skip_check:
        description: Не проверять хосты с раннера (хост ещё не поднят специально)
        type: boolean
        default: false

# Оба окружения коммитят в main. Не отменяем ожидающие запуски другого окружения.
concurrency:
  group: cfg-publish
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.select.outputs.environments }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select environments
        id: select
        run: node scripts/select-environments.mjs

  publish:
    name: Publish ${{ matrix.environment }}
    needs: select
    if: needs.select.outputs.environments != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        environment: ${{ fromJSON(needs.select.outputs.environments) }}
    env:
      ENVIRONMENT: ${{ matrix.environment }}
      HOSTS_PATH: ${{ matrix.environment == 'prod' && 'hosts.json' || 'dev/hosts.json' }}
      CONFIG_PATH: ${{ matrix.environment == 'prod' && 'config.json' || 'dev/config.json' }}
      RUTUBE_PATH: ${{ matrix.environment == 'prod' && 'rutube.json' || 'dev/rutube.json' }}
      # Ключи подписи и шифрования по окружению (SAM-809). Приватные — только здесь, из секретов.
      SIGN_KEY: ${{ matrix.environment == 'prod' && secrets.SIGN_KEY_PROD || secrets.SIGN_KEY_DEV }}
      CIPHER_KEY: ${{ matrix.environment == 'prod' && secrets.CIPHER_KEY_PROD || secrets.CIPHER_KEY_DEV }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check hosts
        if: ${{ !inputs.skip_check }}
        run: node scripts/check-hosts.mjs "$HOSTS_PATH" "$CONFIG_PATH"

      - name: Build
        id: build
        run: node scripts/build.mjs --hosts "$HOSTS_PATH" --out "$CONFIG_PATH" --rutube "$RUTUBE_PATH"

      - name: Commit, tag, push
        env:
          VERSION: ${{ steps.build.outputs.version }}
          MESSAGE: ${{ github.event.head_commit.message || 'ручной запуск' }}
        run: bash scripts/release.sh

      # Разливаем тот же подписанный конверт в описания видео Rutube (запасной канал при
      # «белых списках»). Только если конфиг изменился. Токен ротируется и пишется обратно
      # в секрет своего окружения через PAT (секрет GH_PAT). Каждая задача получает токены
      # только своего окружения; выбор — в rutubeTokenSource (scripts/lib.mjs).
      # RUTUBE_TOKENS_LEGACY — старый общий секрет: dev читает его, пока нет RUTUBE_TOKENS_DEV.
      - name: Publish to Rutube
        if: steps.build.outputs.changed == 'true'
        env:
          RUTUBE_TOKENS_PROD: ${{ matrix.environment == 'prod' && secrets.RUTUBE_TOKENS_PROD || '' }}
          RUTUBE_TOKENS_DEV: ${{ matrix.environment == 'dev' && secrets.RUTUBE_TOKENS_DEV || '' }}
          RUTUBE_TOKENS_LEGACY: ${{ matrix.environment == 'dev' && secrets.RUTUBE_TOKENS || '' }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: node scripts/rutube-publish.mjs --config "$CONFIG_PATH" --rutube "$RUTUBE_PATH"
