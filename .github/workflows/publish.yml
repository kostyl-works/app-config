name: Publish hosts
run-name: "hosts: ${{ github.event.head_commit.message || 'ручной запуск' }} (${{ github.actor }})"

# Правка hosts.json в main → CI кладёт рядом config.json с новой версией и ставит тег.
# Ручной запуск — для первой публикации и повтора.
on:
  push:
    branches: [main]
    paths: [hosts.json]
  workflow_dispatch:
    inputs:
      skip_check:
        description: Не проверять хосты с раннера (хост ещё не поднят специально)
        type: boolean
        default: false

# Одна публикация за раз: иначе два запуска возьмут один номер версии.
concurrency:
  group: cfg-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check hosts
        if: ${{ !inputs.skip_check }}
        run: node scripts/check-hosts.mjs hosts.json config.json

      - name: Build
        id: build
        run: node scripts/build.mjs --hosts hosts.json --out config.json

      - name: Commit, tag, push
        if: steps.build.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.build.outputs.version }}
          MESSAGE: ${{ github.event.head_commit.message || 'ручной запуск' }}
        run: bash scripts/release.sh
