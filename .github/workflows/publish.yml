name: Publish hosts
run-name: "hosts (${{ inputs.environment }}): ручной запуск (${{ github.actor }})"

# SAM-809: публикация ТОЛЬКО вручную — пунктом «Публикация конфига» в crypto/keys.sh (репозиторий
# приложения) или кнопкой Run workflow. Автопубликации при пуше нет: правка hosts.json сама в
# прод не уходит. Аварийный путь с телефона: поправить файл в браузере → Run workflow → окружение.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Какое окружение опубликовать
        type: choice
        required: true
        default: dev
        options: [dev, prod]
      skip_check:
        description: Не проверять хосты с раннера (хост ещё не поднят специально)
        type: boolean
        default: false

# Оба окружения коммитят в main. Не отменяем ожидающие запуски другого окружения.
concurrency:
  group: cfg-publish
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.select.outputs.environments }}
    steps:
      # Actions закреплены по хешу коммита: метку v4 владелец может передвинуть на другой код.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Select environments
        id: select
        run: node scripts/select-environments.mjs

  publish:
    name: Publish ${{ matrix.environment }}
    needs: select
    if: needs.select.outputs.environments != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        environment: ${{ fromJSON(needs.select.outputs.environments) }}
    # Секретов на уровне задачи нет: каждый получает только тот шаг, которому он нужен.
    env:
      ENVIRONMENT: ${{ matrix.environment }}
      HOSTS_PATH: ${{ matrix.environment == 'prod' && 'hosts.json' || 'dev/hosts.json' }}
      CONFIG_PATH: ${{ matrix.environment == 'prod' && 'config.json' || 'dev/config.json' }}
      RUTUBE_PATH: ${{ matrix.environment == 'prod' && 'rutube.json' || 'dev/rutube.json' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Check hosts
        if: ${{ !inputs.skip_check }}
        run: node scripts/check-hosts.mjs "$HOSTS_PATH" "$CONFIG_PATH"

      # Подпись (SAM-809): закрытый ключ — только этому шагу. keys.json — белый список ключей,
      # которые знает выпущенная сборка приложения.
      - name: Build
        id: build
        env:
          SIGN_KEY: ${{ matrix.environment == 'prod' && secrets.SIGN_KEY_PROD || secrets.SIGN_KEY_DEV }}
          CIPHER_KEY: ${{ matrix.environment == 'prod' && secrets.CIPHER_KEY_PROD || secrets.CIPHER_KEY_DEV }}
        run: node scripts/build.mjs --hosts "$HOSTS_PATH" --out "$CONFIG_PATH" --rutube "$RUTUBE_PATH" --keys keys.json

      - name: Commit, tag, push
        env:
          VERSION: ${{ steps.build.outputs.version }}
          MESSAGE: ручной запуск (${{ github.actor }})
        run: bash scripts/release.sh

      # Тот же подписанный конверт — в описания видео Rutube (запасной канал при «белых
      # списках»). Запускается всегда: скрипт сверяет каждое описание и пишет только отставшие,
      # так отставший после сбоя Rutube догоняется следующей публикацией. Токен обменивается,
      # только если есть что писать, и сохраняется в секрет окружения через GH_PAT СРАЗУ после
      # обмена. Каждая задача получает токены только своего окружения (rutubeTokenSource).
      # RUTUBE_TOKENS_LEGACY — старый общий секрет: dev читает его, пока нет RUTUBE_TOKENS_DEV.
      - name: Publish to Rutube
        env:
          CIPHER_KEY: ${{ matrix.environment == 'prod' && secrets.CIPHER_KEY_PROD || secrets.CIPHER_KEY_DEV }}
          RUTUBE_TOKENS_PROD: ${{ matrix.environment == 'prod' && secrets.RUTUBE_TOKENS_PROD || '' }}
          RUTUBE_TOKENS_DEV: ${{ matrix.environment == 'dev' && secrets.RUTUBE_TOKENS_DEV || '' }}
          RUTUBE_TOKENS_LEGACY: ${{ matrix.environment == 'dev' && secrets.RUTUBE_TOKENS || '' }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: node scripts/rutube-publish.mjs --config "$CONFIG_PATH" --rutube "$RUTUBE_PATH"
